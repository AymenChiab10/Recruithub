openapi: 3.0.3
info:
  title: RecruitHub Recruitment API
  version: 1.0.0
paths:
  /api/v1/candidates:
    post:
      summary: Create a candidate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Candidate'
      responses:
        '201':
          description: Candidate created
  /api/v1/offers:
    get:
      summary: List offers
      responses:
        '200':
          description: Offers found
  /api/v1/candidatures:
    post:
      summary: Submit an application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationRequest'
      responses:
        '201':
          description: Application received
        '400':
          description: Invalid request
  /api/v1/offers/{offerId}/ranking:
    get:
      summary: Rank applications for an offer
      parameters:
        - name: offerId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Applications ranked by descending score

components:
  schemas:
    Candidate:
      type: object
      required: [firstName, lastName, email]
      properties:
        id:
          type: integer
          format: int64
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        skills:
          type: array
          items:
            type: string
        experienceYears:
          type: integer
    ApplicationRequest:
      type: object
      required: [candidateId, offerId]
      properties:
        candidateId:
          type: integer
          format: int64
        offerId:
          type: integer
          format: int64
