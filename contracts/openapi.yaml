openapi: 3.0.3
info:
  title: RecruitHub Recruitment API
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: API Gateway démarrée localement
  - url: http://localhost:8085
    description: API Gateway accessible depuis l'hôte avec Docker Compose
paths:
  /api/v1/candidates:
    post:
      summary: Create a candidate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateRequest'
            example:
              firstName: Demo
              lastName: Candidate
              email: demo@example.test
              skills: [Java, Spring Boot]
              experienceYears: 5
              diplomaTitle: Computer Science
              diplomaInstitution: IIT
              diplomaYear: 2024
      responses:
        '201':
          description: Candidate created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Candidate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/BadGateway'
    get:
      summary: List candidates
      responses:
        '200':
          description: Candidates found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Candidate'
        '502':
          $ref: '#/components/responses/BadGateway'
  /api/v1/candidates/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      summary: Get a candidate
      responses:
        '200':
          description: Candidate found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Candidate'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
    put:
      summary: Update a candidate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateRequest'
      responses:
        '200':
          description: Candidate updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Candidate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/BadGateway'
    delete:
      summary: Delete a candidate
      responses:
        '204':
          description: Candidate deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
  /api/v1/offers:
    post:
      summary: Create an offer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfferRequest'
            example:
              title: Backend Developer
              description: Develop and maintain RecruitHub services
              requiredSkills: [Java, Spring Boot, PostgreSQL]
              requiredExperienceYears: 3
      responses:
        '201':
          description: Offer created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '502':
          $ref: '#/components/responses/BadGateway'
    get:
      summary: List offers
      responses:
        '200':
          description: Offers found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Offer'
        '502':
          $ref: '#/components/responses/BadGateway'
  /api/v1/offers/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      summary: Get an offer
      responses:
        '200':
          description: Offer found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
    put:
      summary: Update an offer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfferRequest'
      responses:
        '200':
          description: Offer updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
    delete:
      summary: Delete an offer
      responses:
        '204':
          description: Offer deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
  /api/v1/offers/{offerId}/ranking:
    get:
      summary: Rank applications for an offer
      parameters:
        - name: offerId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Applications ranked by descending score
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RankedApplication'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/candidatures:
    post:
      summary: Submit an application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationRequest'
            example:
              candidateId: 1
              offerId: 1
      responses:
        '201':
          description: Application received, verified and scored or pending retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/BadGateway'
    get:
      summary: List applications
      responses:
        '200':
          description: Applications found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Application'
        '502':
          $ref: '#/components/responses/BadGateway'
  /api/v1/candidatures/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      summary: Get an application
      responses:
        '200':
          description: Application found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
    delete:
      summary: Delete an application
      responses:
        '204':
          description: Application deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: Matching Service is unavailable when retrieving an offer ranking
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadGateway:
      description: The API Gateway cannot reach the Recruitment Service
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    CandidateRequest:
      type: object
      required: [firstName, lastName, email]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        skills:
          type: array
          items:
            type: string
        experienceYears:
          type: integer
          minimum: 0
        diplomaTitle:
          type: string
        diplomaInstitution:
          type: string
        diplomaYear:
          type: integer
          minimum: 0
    Candidate:
      allOf:
        - $ref: '#/components/schemas/CandidateRequest'
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              format: int64
    OfferRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
        description:
          type: string
        requiredSkills:
          type: array
          items:
            type: string
        requiredExperienceYears:
          type: integer
          minimum: 0
    Offer:
      allOf:
        - $ref: '#/components/schemas/OfferRequest'
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              format: int64
    ApplicationRequest:
      type: object
      required: [candidateId, offerId]
      properties:
        candidateId:
          type: integer
          format: int64
        offerId:
          type: integer
          format: int64
    Application:
      type: object
      required: [id, candidateId, offerId, status, submittedAt, diplomaVerified]
      properties:
        id:
          type: integer
          format: int64
        candidateId:
          type: integer
          format: int64
        offerId:
          type: integer
          format: int64
        status:
          type: string
          enum:
            - RECEIVED
            - DIPLOMA_VERIFIED
            - DIPLOMA_NOT_FOUND
            - DIPLOMA_PENDING_VERIFICATION
            - SCORING_PENDING
            - SCORED
            - ACCEPTED
            - REJECTED
            - PENDING
        submittedAt:
          type: string
          format: date-time
        score:
          type: number
          format: double
          nullable: true
        diplomaVerified:
          type: boolean
    RankedApplication:
      type: object
      required: [applicationId, score, rank]
      properties:
        applicationId:
          type: integer
          format: int64
        score:
          type: number
          format: double
        rank:
          type: integer
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
