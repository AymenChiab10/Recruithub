server:
  port: 8082

spring:
  application:
    name: matching-service
  datasource:
    url: ${DB_URL:jdbc:h2:mem:matching;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

recruithub:
  matching:
    grpc-port: ${GRPC_PORT:9090}

management:
  endpoints:
    web:
      exposure:
        include: health,info
