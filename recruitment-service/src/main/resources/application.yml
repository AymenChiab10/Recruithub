server:
  port: 8081

spring:
  application:
    name: recruitment-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/recruithub}
    username: ${DB_USERNAME:recruithub}
    password: ${DB_PASSWORD:recruithub}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
