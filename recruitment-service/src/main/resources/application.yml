server:
  port: 8081

spring:
  application:
    name: recruitment-service
  datasource:
    url: ${DB_URL:jdbc:h2:mem:recruithub;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

recruithub:
  diploma:
    url: ${DIPLOMA_SERVICE_URL:http://localhost:8083/ws}
  matching:
    host: ${MATCHING_HOST:localhost}
    grpc-port: ${MATCHING_GRPC_PORT:9090}
  recruitment:
    retry-delay-ms: ${RETRY_DELAY_MS:30000}
    remote:
      retry-attempts: ${REMOTE_RETRY_ATTEMPTS:3}
      retry-delay-ms: ${REMOTE_RETRY_DELAY_MS:200}
      timeout-seconds: ${REMOTE_TIMEOUT_SECONDS:3}

springdoc:
  swagger-ui:
    url: /openapi.yaml
