server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
          routes:
            - id: recruitment-service
              uri: ${RECRUITMENT_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
