server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: recruitment-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
