services:
  recruitment-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: recruithub
      POSTGRES_USER: recruithub
      POSTGRES_PASSWORD: recruithub-dev
    volumes:
      - recruitment-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recruithub -d recruithub"]
      interval: 5s
      timeout: 3s
      retries: 10

  matching-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: matching
      POSTGRES_USER: matching
      POSTGRES_PASSWORD: matching-dev
    volumes:
      - matching-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matching -d matching"]
      interval: 5s
      timeout: 3s
      retries: 10

  diploma-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: diplomas
      POSTGRES_USER: diplomas
      POSTGRES_PASSWORD: diplomas-dev
    volumes:
      - diploma-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diplomas -d diplomas"]
      interval: 5s
      timeout: 3s
      retries: 10

  diploma-registry-service:
    build:
      context: .
      dockerfile: diploma-registry-service/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://diploma-db:5432/diplomas
      DB_USERNAME: diplomas
      DB_PASSWORD: diplomas-dev
    depends_on:
      diploma-db:
        condition: service_healthy
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 10

  matching-service:
    build:
      context: .
      dockerfile: matching-service/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://matching-db:5432/matching
      DB_USERNAME: matching
      DB_PASSWORD: matching-dev
      GRPC_PORT: 9090
    depends_on:
      matching-db:
        condition: service_healthy
    ports:
      - "8082:8082"
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 10

  recruitment-service:
    build:
      context: .
      dockerfile: recruitment-service/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://recruitment-db:5432/recruithub
      DB_USERNAME: recruithub
      DB_PASSWORD: recruithub-dev
      DIPLOMA_SERVICE_URL: http://diploma-registry-service:8083/ws
      MATCHING_HOST: matching-service
      MATCHING_GRPC_PORT: 9090
    depends_on:
      recruitment-db:
        condition: service_healthy
      diploma-registry-service:
        condition: service_healthy
      matching-service:
        condition: service_healthy
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 10

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    environment:
      RECRUITMENT_SERVICE_URL: http://recruitment-service:8081
    depends_on:
      recruitment-service:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 10

volumes:
  recruitment-data:
  matching-data:
  diploma-data:
